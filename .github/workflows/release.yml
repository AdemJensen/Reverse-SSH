name: Build and release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish. Leave blank to build only.'
        required: false
        type: string
      draft_id:
        description: 'Optional ID of an existing draft for that tag.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          RETRY_TAG: ${{ inputs.release_tag }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          tag="$RETRY_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$DRAFT_ID" && -z "$tag" ]]; then
            printf 'A draft ID requires an existing version tag.\n' >&2
            exit 1
          fi
          if [[ -n "$tag" ]]; then
            if [[ "$tag" != v* ]]; then
              printf 'Expected a version tag such as v1.5.2.\n' >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version=$(python3 -c 'import plistlib; print(plistlib.load(open("scripts/Info.plist", "rb"))["CFBundleShortVersionString"])')
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a stable version such as 1.5.2.\n' >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\nbuild_number=%s\ncommit=%s\n' \
            "$tag" "$version" "$((1000 + GITHUB_RUN_NUMBER))" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            asset: ReverseSSH-macOS-Universal.zip
          - platform: windows-x64
            runner: ubuntu-24.04
            asset: ReverseSSH-Windows-x64.zip
          - platform: windows-arm64
            runner: ubuntu-24.04
            asset: ReverseSSH-Windows-ARM64.zip
    env:
      GOFLAGS: -mod=readonly
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Test on macOS
        if: matrix.platform == 'macos'
        env:
          # The v1.5.3 fixture compares JSON timestamps using the local timezone.
          TZ: ${{ inputs.release_tag == 'v1.5.3' && 'Asia/Shanghai' || 'Etc/UTC' }}
        run: go test -race ./...
      - name: Build portable ZIP
        run: sh scripts/build-release.sh "$PLATFORM" "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: needs.metadata.outputs.tag != ''
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: reverse-ssh-release-publication
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual retry builds the tagged code and uses the selected workflow's publisher.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          args=("$RELEASE_TAG" "$SOURCE_COMMIT" "$RUNNER_TEMP/release")
          if [[ -n "$DRAFT_ID" ]]; then
            args+=(--draft-id "$DRAFT_ID")
          fi
          python3 scripts/publish-release.py "${args[@]}"
